[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicality"
version = "0.1.0"
description = "Tools for quantifying rhythm and musicality embedded in language"
requires-python = ">=3.10"
dependencies = ["cmudict>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
musicality = "musicality.cli:main"

[tool.setuptools]
packages = ["musicality"]
